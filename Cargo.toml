[package]
name = "sqlite-tui"
version = "0.1.0"
edition = "2024"
description = "A keyboard-driven SQLite browser and SQL workbench"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
rusqlite = { version = "0.40.2", features = ["bundled", "hooks", "extra_check"] }
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3.27.0"
