name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Validate release version
        shell: bash
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 --locked | python3 -c 'import json, sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"] == "sqlite-tui"))')
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || [[ "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "::error::Release tag must be a stable version matching Cargo.toml (v${version})."
            exit 1
          fi

      - name: Test
        run: cargo test --locked --target "$TARGET"

      - name: Build
        run: cargo build --locked --release --target "$TARGET"

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          archive="sqlite-tui-${GITHUB_REF_NAME}-${TARGET}.tar.gz"
          "target/${TARGET}/release/sqlite-tui" --version
          mkdir -p dist
          COPYFILE_DISABLE=1 tar -czf "dist/${archive}" -C "target/${TARGET}/release" sqlite-tui -C "$GITHUB_WORKSPACE" README.md
          cd dist
          shasum -a 256 "$archive" > "${archive}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sqlite-tui-${{ matrix.target }}
          if-no-files-found: error
          path: |
            dist/sqlite-tui-*.tar.gz
            dist/sqlite-tui-*.tar.gz.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: sqlite-tui-*
          merge-multiple: true
          path: dist

      - name: Verify archives
        working-directory: dist
        run: sha256sum --check ./*.sha256

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/sqlite-tui-*.tar.gz
            dist/sqlite-tui-*.tar.gz.sha256

  update-homebrew-tap:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check tap token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::Set HOMEBREW_TAP_GITHUB_TOKEN with Contents and Pull requests write access to shonenada/homebrew-tap."
            exit 1
          fi

      - name: Checkout sqlite-tui
        uses: actions/checkout@v4

      - name: Checkout homebrew tap
        uses: actions/checkout@v4
        with:
          repository: shonenada/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: homebrew-tap

      - name: Download release checksums
        uses: actions/download-artifact@v4
        with:
          pattern: sqlite-tui-*
          merge-multiple: true
          path: release-artifacts

      - name: Generate formula
        shell: bash
        run: |
          mkdir -p homebrew-tap/Formula
          scripts/generate-formula.sh "$GITHUB_REF_NAME" release-artifacts > homebrew-tap/Formula/sqlite-tui.rb
          ruby -c homebrew-tap/Formula/sqlite-tui.rb

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          path: homebrew-tap
          add-paths: Formula/sqlite-tui.rb
          base: main
          branch: automation/update-sqlite-tui-${{ github.ref_name }}
          delete-branch: true
          commit-message: Update sqlite-tui formula to ${{ github.ref_name }}
          title: Update sqlite-tui formula to ${{ github.ref_name }}
          body: |
            Update `Formula/sqlite-tui.rb` to `${{ github.ref_name }}`.

            This change was generated by the release workflow in `shonenada-vibe/sqlite-tui`.
